name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: side-479110

      - name: Deploy to VM
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        run: |
          # Execute deployment via gcloud SSH using a heredoc to avoid pipe issues
          gcloud compute ssh --zone "us-central1-c" "instance-20260120-151422" \
            --project "side-479110" \
            --command "bash -s" << 'EOF'
              set -e
              export GITHUB_REPOSITORY="${{ github.repository }}"
              export DELTA_API_KEY="${{ secrets.DELTA_API_KEY }}"
              export DELTA_API_SECRET="${{ secrets.DELTA_API_SECRET }}"
              
              echo "Checking secrets..."
              if [ -z "$DELTA_API_KEY" ]; then echo "❌ DELTA_API_KEY is missing!"; exit 1; fi
              if [ -z "$DELTA_API_SECRET" ]; then echo "❌ DELTA_API_SECRET is missing!"; exit 1; fi
              echo "✅ Secrets are present (Key length: ${#DELTA_API_KEY})"

              DEPLOY_DIR="/opt/deltago"
              SERVICE_NAME="deltago"

              echo "=== DeltaGo Deployment Script ==="

              # Install dependencies
              if ! command -v git &> /dev/null; then
                  echo "Installing Git..."
                  sudo apt-get update && sudo apt-get install -y git
              fi

              if [ ! -d "/usr/local/go" ]; then
                  echo "Installing Go..."
                  wget -q https://go.dev/dl/go1.22.0.linux-amd64.tar.gz
                  sudo rm -rf /usr/local/go
                  sudo tar -C /usr/local -xzf go1.22.0.linux-amd64.tar.gz
                  rm go1.22.0.linux-amd64.tar.gz
              fi

              # Setup directories
              sudo mkdir -p $DEPLOY_DIR
              sudo chown $USER:$USER $DEPLOY_DIR
              sudo mkdir -p /etc/deltago

              # Update code
              if [ -d "$DEPLOY_DIR/.git" ]; then
                  echo "Updating existing repository..."
                  cd $DEPLOY_DIR
                  git fetch origin
                  git reset --hard origin/main
              else
                  echo "Cloning repository..."
                  git clone https://github.com/$GITHUB_REPOSITORY.git $DEPLOY_DIR
              fi

              # Build
              echo "Building Go binary..."
              cd $DEPLOY_DIR/cmd/bot
              /usr/local/go/bin/go build -o $DEPLOY_DIR/bot .

              # Setup Environment
              echo "Setting up environment variables..."
              sudo tee /etc/deltago/env > /dev/null << ENVEOF
DELTA_API_KEY=$DELTA_API_KEY
DELTA_API_SECRET=$DELTA_API_SECRET
ENVEOF
              sudo chmod 600 /etc/deltago/env

              # Service Management
              echo "Installing systemd service..."
              sudo cp $DEPLOY_DIR/deploy/deltago.service /etc/systemd/system/
              sudo systemctl daemon-reload
              sudo systemctl stop $SERVICE_NAME 2>/dev/null || true
              sudo systemctl enable $SERVICE_NAME
              sudo systemctl restart $SERVICE_NAME

              echo "=== Deployment Complete ==="
              sudo systemctl status $SERVICE_NAME --no-pager
EOF
