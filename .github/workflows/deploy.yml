name: Deploy to GCP VM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: side-479110

      - name: Create env file locally
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        run: |
          echo "Creating env file with secrets..."
          echo "API Key length: ${#DELTA_API_KEY}"
          echo "API Secret length: ${#DELTA_API_SECRET}"
          printf 'DELTA_API_KEY=%s\n' "$DELTA_API_KEY" > /tmp/deltago.env
          printf 'DELTA_API_SECRET=%s\n' "$DELTA_API_SECRET" >> /tmp/deltago.env
          echo "Env file created with $(wc -c < /tmp/deltago.env) bytes"


      - name: Copy files to VM
        run: |
          gcloud compute scp /tmp/deltago.env instance-20260120-151422:/tmp/deltago.env \
            --zone "us-central1-c" \
            --project "side-479110" \
            --strict-host-key-checking=no

      - name: Deploy to VM
        run: |
          gcloud compute ssh --zone "us-central1-c" "instance-20260120-151422" \
            --project "side-479110" \
            --strict-host-key-checking=no \
            --command "
set -e
DEPLOY_DIR=/opt/deltago
SERVICE_NAME=deltago
GITHUB_REPOSITORY=${{ github.repository }}

echo '=== DeltaGo Deployment Script ==='

# Install git if needed
if ! command -v git > /dev/null; then
  echo 'Installing Git...'
  sudo apt-get update && sudo apt-get install -y git
fi

# Setup directories
sudo mkdir -p /etc/deltago

# Always fresh clone to avoid permission issues
echo 'Cloning repository (fresh)...'
sudo rm -rf \$DEPLOY_DIR
git clone --depth 1 --branch main https://github.com/\$GITHUB_REPOSITORY.git \$DEPLOY_DIR
cd \$DEPLOY_DIR

# Build both binaries
echo 'Building Go binaries...'
cd \$DEPLOY_DIR/cmd/bot
/usr/local/go/bin/go build -o \$DEPLOY_DIR/bot .
cd \$DEPLOY_DIR/cmd/adaptive
/usr/local/go/bin/go build -o \$DEPLOY_DIR/adaptive .

# Setup env file from the one we copied
echo 'Setting up environment...'
sudo cp /tmp/deltago.env /etc/deltago/env
sudo chmod 600 /etc/deltago/env

# Service management
echo 'Setting up systemd service...'
sudo cp \$DEPLOY_DIR/deploy/deltago.service /etc/systemd/system/
sudo systemctl daemon-reload
sudo systemctl stop \$SERVICE_NAME 2>/dev/null || true
sudo systemctl enable \$SERVICE_NAME
sudo systemctl restart \$SERVICE_NAME

echo '=== Deployment Complete ==='
sudo systemctl status \$SERVICE_NAME --no-pager
"
